appId: com.archeon.workspace
productName: Archeon Workspace
copyright: Copyright © Archeon Workspace contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Prefer prebuilt node-pty binaries (no Visual Studio required for package).
# Install VS Build Tools only if you must rebuild natives from source.
npmRebuild: false
nodeGypRebuild: false
# node-pty is a native module; unpack so the binary can load at runtime
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/node-pty/prebuilds/**/*
win:
  # Avoid winCodeSign symlink extraction (needs SeCreateSymbolicLinkPrivilege /
  # Developer Mode). Unsigned local builds are fine for smoke tests.
  signAndEditExecutable: false
  signDlls: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Default name for NSIS; portable overrides below so artifacts do not clash.
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Archeon Workspace
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  maintainer: Shashank-Upadhyay01 <iamshashank1o1@gmail.com>
  desktop:
    Name: Archeon Workspace
    Comment: Multi-agent terminal workspace
    Categories: Development;Utility;
    StartupWMClass: archeon-workspace
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  synopsis: Multi-agent terminal workspace for developers
  description: >-
    Dockable shell panes, AI chat, and CLI agent workspaces with layout
    presets, multi-workspace resume, and secure API key storage.
